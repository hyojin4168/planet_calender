<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>할 일 등록 | Planet Calendar</title>

  <link rel="stylesheet" href="../../css/todo-form.css">
</head>
<body>

<main class="todo-page">

  <section class="todo-form-container">

    <h2>할 일 등록</h2>

    <form class="todo-form">

      <div class="form-group">
        <label>내용</label>
        <input type="text"
               name="title"
               placeholder="할 일을 입력하세요"
               required>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save">
          저장하기
        </button>

        <a href="./todo-list.html" class="btn-cancel">취소</a>
      </div>

    </form>

  </section>

</main>

</body>
</html>
