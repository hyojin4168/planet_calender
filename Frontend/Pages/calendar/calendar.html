<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Planet Calendar</title>

  <link rel="stylesheet" href="../../css/calendar.css">
</head>
<body>

  <!-- =====================
       Header
  ====================== -->
  <header class="global-header">
    <h1>Planet Calendar</h1>
  </header>

  <!-- =====================
       Main (Calendar)
  ====================== -->
  <main class="calendar-main">

    <section class="calendar-card">

      <!-- 요일 -->
      <div class="week-row">
        <div class="week sun">Sun</div>
        <div class="week">Mon</div>
        <div class="week">Tue</div>
        <div class="week">Wed</div>
        <div class="week">Thu</div>
        <div class="week">Fri</div>
        <div class="week sat">Sat</div>
      </div>

      <!-- 날짜 (더미 데이터) -->
      <div class="date-grid">

        <div class="date other-month">29</div>
        <div class="date other-month">30</div>
        <div class="date other-month">31</div>

        <div class="date">1</div>
        <div class="date">2</div>
        <div class="date has-event">3</div>
        <div class="date">4</div>

        <div class="date">5</div>
        <div class="date">6</div>
        <div class="date">7</div>
        <div class="date has-event">8</div>
        <div class="date">9</div>
        <div class="date">10</div>
        <div class="date">11</div>

        <div class="date">12</div>
        <div class="date">13</div>
        <div class="date">14</div>
        <div class="date">15</div>
        <div class="date">16</div>
        <div class="date has-event">17</div>
        <div class="date">18</div>

        <div class="date">19</div>
        <div class="date">20</div>
        <div class="date">21</div>
        <div class="date">22</div>
        <div class="date">23</div>
        <div class="date">24</div>
        <div class="date">25</div>

        <div class="date">26</div>
        <div class="date">27</div>
        <div class="date">28</div>

      </div>

    </section>

    <!-- 일정 목록 패널 -->
    <section class="schedule-panel">
      <div class="schedule-header">
        <h3 class="schedule-title">2월 17일 일정</h3>
      </div>

      <ul class="schedule-list">
        <li class="schedule-item">
          <strong>회의</strong>
          <p>오전 10:00 - 팀 미팅</p>
        </li>

        <li class="schedule-item">
          <strong>운동</strong>
          <p>오후 7:00 - 헬스장</p>
        </li>
      </ul>
    </section>

  </main>

</body>
</html>
