<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>D-Day 목록 | Planet Calendar</title>

  <link rel="stylesheet" href="../../css/dday.css">
</head>
<body>

<main class="dday-page">

  <section class="dday-list-container">

    <!-- 헤더 영역 -->
    <div class="dday-header">
      <h2 class="page-title">D-Day 목록</h2>
      <a href="./dday-form.html" class="btn-add">+ 등록</a>
    </div>

    <ul class="dday-list">

      <!-- 더미 데이터 1 -->
      <li class="dday-item">

        <span class="dday-count">D-3</span>

        <div class="dday-info">
          <span class="dday-title">시험</span>
          <span class="dday-date">2026-02-20</span>
        </div>

        <div class="dday-actions">
          <a href="./dday-edit.html" class="btn-edit">수정</a>
          <a href="./dday-delete.html" class="btn-delete">삭제</a>
        </div>

      </li>

      <!-- 더미 데이터 2 -->
      <li class="dday-item">

        <span class="dday-count">D-12</span>

        <div class="dday-info">
          <span class="dday-title">여행</span>
          <span class="dday-date">2026-03-01</span>
        </div>

        <div class="dday-actions">
          <a href="./dday-edit.html" class="btn-edit">수정</a>
          <a href="./dday-delete.html" class="btn-delete">삭제</a>
        </div>

      </li>

    </ul>

  </section>

</main>

</body>
</html>
