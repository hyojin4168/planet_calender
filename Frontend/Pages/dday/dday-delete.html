<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>D-Day 삭제 | Planet Calendar</title>

  <link rel="stylesheet" href="../../css/dday-form.css">
</head>
<body>

<main class="dday-page">

  <section class="dday-form-container danger">

    <h2 class="page-title">D-Day 삭제</h2>

    <p class="delete-text">
      이 D-Day를 삭제하시겠습니까?
    </p>

    <div class="form-actions">
      <button type="button"
              class="btn-delete"
              onclick="confirmDelete()">
        삭제
      </button>

      <a href="../dday.html" class="btn-cancel">취소</a>
    </div>

  </section>

</main>

<script>
function confirmDelete() {
  if (confirm("정말 삭제하시겠습니까?")) {
    // 실제 삭제 로직 대신 더미 이동
    window.location.href = "../dday.html";
  }
}
</script>

</body>
</html>
