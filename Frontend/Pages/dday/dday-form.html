<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>D-Day 등록 | Planet Calendar</title>

  <link rel="stylesheet" href="../../css/dday.css">
</head>
<body>

<main class="dday-page">

  <section class="dday-form-container">

    <h2 class="page-title">
      D-Day 등록
    </h2>

    <form class="dday-form">

      <div class="form-group">
        <label>제목</label>
        <input type="text"
               name="title"
               placeholder="예: 시험"
               required>
      </div>

      <div class="form-group">
        <label>날짜</label>
        <input type="date"
               name="date"
               required>
      </div>

      <div class="form-actions">

        <button type="submit" class="btn-save">
          저장하기
        </button>

        <a href="../dday.html" class="btn-cancel">취소</a>

      </div>

    </form>

  </section>

</main>

</body>
</html>
